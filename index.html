<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>Weather App</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="weather-card">

            <h1>🌤 Weather App</h1>

            <!-- Search Area -->
            <div class="search-box">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                >

                <button id="searchBtn">
                    Search
                </button>
            </div>

            <!-- Weather Icon -->
            <div class="weather-icon">
                ☀️
            </div>

            <!-- Temperature -->
            <h2 id="temperature">
                --°C
            </h2>

            <!-- City -->
            <h3 id="city">
                Search a city
            </h3>

            <!-- Description -->
            <p id="description">
                Weather description
            </p>

            <!-- Weather Details -->
            <div class="details">

    <div class="detail-box">
        <h4>Humidity</h4>
        <p id="humidity">--%</p>
    </div>

    <div class="detail-box">
        <h4>Wind</h4>
        <p id="wind">-- km/h</p>
    </div>

    <div class="detail-box">
        <h4>Feels Like</h4>
        <p id="feelsLike">--°C</p>
    </div>

    <div class="detail-box">
        <h4>Pressure</h4>
        <p id="pressure">-- hPa</p>
    </div>

</div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
